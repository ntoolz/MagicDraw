        function updateCursorStyle() {
            canvas.className = '';
            if (currentTool === 'pointer') canvas.classList.add('cursor-pointer');
            else if (currentTool === 'text') canvas.classList.add('cursor-text');
            else if (currentTool === 'eraser') canvas.classList.add('cursor-eraser');
            else canvas.classList.add('cursor-crosshair');
        }

        // Paste Image / GIF
        window.addEventListener('paste', (e) => {
            const items = (e.clipboardData || e.originalEvent.clipboardData).items;
            let pastedImage = false;
            for (let item of items) {
                if (item.type.indexOf('image') === 0 || item.type.indexOf('gif') >= 0) {
                    const blob = item.getAsFile();
                    const reader = new FileReader();
                    reader.onload = function(event) {
                        const imgObj = new Image();
                        imgObj.onload = function() {
                            const world = getWorldCoords(window.innerWidth / 2, window.innerHeight / 2);
                            const maxW = 400;
                            const scaleVal = imgObj.width > maxW ? maxW / imgObj.width : 1;
                            const w = imgObj.width * scaleVal;
                            const h = imgObj.height * scaleVal;

                            elements.push({
                                type: 'image',
                                layerId: activeLayerId,
                                x: world.x - w / 2,
                                y: world.y - h / 2,
                                w: w,
                                h: h,
                                imgSrc: event.target.result,
                                angle: 0,
                                isAnimated: false
                            });
                            saveToLocalStorage();
                            redraw();
                            showToast("Image/GIF pasted successfully!");
                        };
                        imgObj.src = event.target.result;
                    };
                    reader.readAsDataURL(blob);
                    pastedImage = true;
                }
            }
            if (pastedImage) {
                e.preventDefault();
            }
        });

        function saveActiveText() {
            if (textInput.style.display === 'block') {
                const textVal = textInput.value;
                if (textVal.trim() === '') {
                    if (editingTextIndex !== null) {
                        elements.splice(editingTextIndex, 1);
                        selectedElementIndex = null;
                        sideMenu.classList.remove('open');
                    }
                } else if (editingTextIndex !== null && elements[editingTextIndex]) {
                    const el = elements[editingTextIndex];
                    el.text = textVal;
                    showToast("Text saved");
                }
                saveToLocalStorage();
                redraw();
                textInput.style.display = 'none';
                textInput.value = '';
                editingTextIndex = null;
            }
        }

        textInput.addEventListener('input', () => {
            if (editingTextIndex !== null && elements[editingTextIndex]) {
                const el = elements[editingTextIndex];
                el.text = textInput.value;
                redraw();
            }
        });

        textInput.addEventListener('blur', () => { saveActiveText(); });
        textInput.addEventListener('keydown', (ke) => {
            if (ke.key === 'Escape') {
                saveActiveText();
            }
        });

        function getWorldCoords(clientX, clientY) {
            return {
                x: (clientX - panX) / scale,
                y: (clientY - panY) / scale
            };
        }

        canvas.addEventListener('mousedown', startAction);
        canvas.addEventListener('mousemove', drawAction);
        canvas.addEventListener('mouseup', stopAction);
        canvas.addEventListener('click', handleCanvasClick);
        canvas.addEventListener('dblclick', handleDoubleClick);

        window.addEventListener('keydown', (e) => {
            if ((e.key === 'Delete' || e.key === 'Backspace') && selectedElementIndex !== null) {
                if (document.activeElement !== textInput) {
                    elements.splice(selectedElementIndex, 1);
                    selectedElementIndex = null;
                    sideMenu.classList.remove('open');
                    saveToLocalStorage();
                    redraw();
                    showToast("Selected object deleted");
                }
            }
        });

        function handleCanvasClick(e) {
            if (currentTool === 'text') {
                openTextInput(e.clientX, e.clientY, null);
            }
        }

        function startAction(e) {
            if (currentTool === 'text') return; // Handled by click
            saveActiveText();
            const world = getWorldCoords(e.clientX, e.clientY);
            lastMouseX = e.clientX;
            lastMouseY = e.clientY;

            if (currentTool === 'eraser') {
                eraseAt(world.x, world.y);
                return;
            }

            if (currentTool === 'pointer') {
                if (selectedElementIndex !== null) {
                    const el = elements[selectedElementIndex];
                    const layer = layers.find(l => l.id === el.layerId);
                    if (layer && layer.visible) {
                        if (el.type === 'line' || el.type === 'arrow') {
                            const hitEndpoint = getClickedEndpoint(world.x, world.y, el);
                            if (hitEndpoint) {
                                isDraggingEndpoint = hitEndpoint;
                                return;
                            }
                        } else if (['rectangle', 'circle', 'diamond', 'image', 'text'].includes(el.type)) {
                            const handle = getClickedHandle(world.x, world.y, selectedElementIndex);
                            if (handle) {
                                if (handle === 'rotate') isRotating = true;
                                else isResizing = true;
                                activeHandle = handle;
                                return;
                            }
                        }
                    }
                }

                const clickedIndex = findElementAt(world.x, world.y);
                if (clickedIndex !== null) {
                    selectedElementIndex = clickedIndex;
                    isDragging = true;
                    canvas.className = 'cursor-grabbing';
                    updateSideMenu();
                    redraw();
                    showToast("Object selected");
                    return;
                } else {
                    selectedElementIndex = null;
                    sideMenu.classList.remove('open');
                    isPanning = true;
                    panStartX = e.clientX - panX;
                    panStartY = e.clientY - panY;
                    canvas.className = 'cursor-grabbing';
                    redraw();
                }
                return;
            }

            isDrawing = true;
            startX = world.x;
            startY = world.y;
            currentWorldX = world.x;
            currentWorldY = world.y;
            if (currentTool === 'pencil') {
                currentPath = [{ x: world.x, y: world.y }];
            }
            redraw();
        }

        function drawAction(e) {
            const world = getWorldCoords(e.clientX, e.clientY);
            const dx = (e.clientX - lastMouseX) / scale;
            const dy = (e.clientY - lastMouseY) / scale;
            lastMouseX = e.clientX;
            lastMouseY = e.clientY;

            currentWorldX = world.x;
            currentWorldY = world.y;

            if (currentTool === 'eraser' && e.buttons === 1) {
                eraseAt(world.x, world.y);
                return;
            }

            if (isPanning) {
                panX = e.clientX - panStartX;
                panY = e.clientY - panStartY;
                redraw();
                return;
            }

            if (isDraggingEndpoint && selectedElementIndex !== null) {
                const el = elements[selectedElementIndex];
                if (isDraggingEndpoint === 'start') {
                    el.startX = world.x;
                    el.startY = world.y;
                } else {
                    el.endX = world.x;
                    el.endY = world.y;
                }
                redraw();
                return;
            }

            if (isRotating && selectedElementIndex !== null) {
                const el = elements[selectedElementIndex];
                const b = getElementBounds(el);
                const cx = b.x + b.w / 2;
                const cy = b.y + b.h / 2;
                el.angle = Math.atan2(world.y - cy, world.x - cx) + Math.PI / 2;
                redraw();
                return;
            }

            if (isResizing && selectedElementIndex !== null) {
                resizeElement(elements[selectedElementIndex], activeHandle, world.x, world.y);
                redraw();
                return;
            }

            if (isDragging && selectedElementIndex !== null) {
                moveElement(elements[selectedElementIndex], dx, dy);
                redraw();
                return;
            }

            if (!isDrawing) return;

            if (currentTool === 'pencil') {
                currentPath.push({ x: world.x, y: world.y });
            }

            redraw();
        }

        function stopAction(e) {
            if (isPanning) {
                isPanning = false;
                updateCursorStyle();
                redraw();
                return;
            }

            if (isDragging || isResizing || isRotating || isDraggingEndpoint) {
                isDragging = false;
                isResizing = false;
                isRotating = false;
                isDraggingEndpoint = null;
                activeHandle = null;
                updateCursorStyle();
                saveToLocalStorage();
                redraw();
                showToast("Transformation saved");
                return;
            }

            if (!isDrawing) return;
            isDrawing = false;
            const world = getWorldCoords(e.clientX, e.clientY);

            if (currentTool === 'pencil' && currentPath.length > 1) {
                elements.push({ type: 'pencil', layerId: activeLayerId, path: [...currentPath], color: strokeColor, width: strokeWidth, lineType, lineGap, angle: 0, isAnimated: false });
                showToast("Pencil stroke drawn");
            } else if (currentTool === 'rectangle' && (world.x !== startX || world.y !== startY)) {
                elements.push({ type: 'rectangle', layerId: activeLayerId, x: startX, y: startY, w: world.x - startX, h: world.y - startY, color: strokeColor, width: strokeWidth, lineType, lineGap, fillType: 'none', angle: 0, isAnimated: false });
                showToast("Rectangle drawn");
            } else if (currentTool === 'diamond' && (world.x !== startX || world.y !== startY)) {
                elements.push({ type: 'diamond', layerId: activeLayerId, startX, startY, endX: world.x, endY: world.y, color: strokeColor, width: strokeWidth, lineType, lineGap, fillType: 'none', angle: 0, isAnimated: false });
                showToast("Diamond drawn");
            } else if (currentTool === 'circle' && (world.x !== startX || world.y !== startY)) {
                elements.push({ type: 'circle', layerId: activeLayerId, startX, startY, endX: world.x, endY: world.y, color: strokeColor, width: strokeWidth, lineType, lineGap, fillType: 'none', angle: 0, isAnimated: false });
                showToast("Circle drawn");
            } else if (currentTool === 'line' && (world.x !== startX || world.y !== startY)) {
                let snapped = getSnapPoint(world.x, world.y, null);
                elements.push({ type: 'line', layerId: activeLayerId, startX, startY, endX: snapped.x, endY: snapped.y, lineStyle, color: strokeColor, width: strokeWidth, lineType, lineGap, angle: 0, isAnimated: false });
                showToast("Line drawn");
            } else if (currentTool === 'arrow' && (world.x !== startX || world.y !== startY)) {
                let snapped = getSnapPoint(world.x, world.y, null);
                elements.push({ type: 'arrow', layerId: activeLayerId, startX, startY, endX: snapped.x, endY: snapped.y, lineStyle, color: strokeColor, width: strokeWidth, lineType, lineGap, angle: 0, isAnimated: false });
                showToast("Arrow drawn");
            }

            saveToLocalStorage();
            redraw();
        }

        function getClickedEndpoint(x, y, el) {
            const handleRadius = 10 / scale;
            if (Math.hypot(el.startX - x, el.startY - y) <= handleRadius) return 'start';
            if (Math.hypot(el.endX - x, el.endY - y) <= handleRadius) return 'end';
            return null;
        }

        function renderLinePath(context, x1, y1, x2, y2, style, elLineType, elLineGap) {
            context.beginPath();
            context.setLineDash(getDashArray(elLineType || 'solid', elLineGap || 8));

            if (style === 'elbow') {
                let midX = (x1 + x2) / 2;
                context.moveTo(x1, y1);
                context.lineTo(midX, y1);
                context.lineTo(midX, y2);
                context.lineTo(x2, y2);
            } else if (style === 'curved') {
                let cx = (x1 + x2) / 2;
                let cy = (y1 + y2) / 2 - 30;
                context.moveTo(x1, y1);
                context.quadraticCurveTo(cx, cy, x2, y2);
            } else {
                context.moveTo(x1, y1);
                context.lineTo(x2, y2);
            }
            context.stroke();
            context.setLineDash([]);
        }

        function renderArrow(context, x1, y1, x2, y2, style, elLineType, elLineGap) {
            renderLinePath(context, x1, y1, x2, y2, style, elLineType, elLineGap);
            let angle = 0;
            if (style === 'elbow') {
                let midX = (x1 + x2) / 2;
                angle = Math.atan2(0, x2 - midX);
            } else if (style === 'curved') {
                let cx = (x1 + x2) / 2;
                let cy = (y1 + y2) / 2 - 30;
                angle = Math.atan2(y2 - cy, x2 - cx);
            } else {
                angle = Math.atan2(y2 - y1, x2 - x1);
            }

            const headLen = 12;
            context.beginPath();
            context.moveTo(x2, y2);
            context.lineTo(x2 - headLen * Math.cos(angle - Math.PI / 6), y2 - headLen * Math.sin(angle - Math.PI / 6));
            context.lineTo(x2 - headLen * Math.cos(angle + Math.PI / 6), y2 - headLen * Math.sin(angle + Math.PI / 6));
            context.lineTo(x2, y2);
            context.fillStyle = strokeColor;
            context.fill();
        }

        function getElementBounds(el) {
            if (el.type === 'rectangle' || el.type === 'image' || el.type === 'text') {
                return { x: Math.min(el.x, el.x + el.w), y: Math.min(el.y, el.y + el.h), w: Math.abs(el.w), h: Math.abs(el.h) };
            } else if (['circle', 'diamond', 'line', 'arrow'].includes(el.type)) {
                let x = Math.min(el.startX, el.endX);
                let y = Math.min(el.startY, el.endY);
                let w = Math.abs(el.endX - el.startX);
                let h = Math.abs(el.endY - el.startY);
                return { x, y, w: Math.max(w, 10), h: Math.max(h, 10) };
            } else if (el.type === 'pencil') {
                let xs = el.path.map(p => p.x);
                let ys = el.path.map(p => p.y);
                let minX = Math.min(...xs), maxX = Math.max(...xs);
                let minY = Math.min(...ys), maxY = Math.max(...ys);
                return { x: minX, y: minY, w: maxX - minX || 10, h: maxY - minY || 10 };
            }
            return { x: 0, y: 0, w: 10, h: 10 };
        }

        function getClickedHandle(x, y, index) {
            const el = elements[index];
            if (!['rectangle', 'circle', 'diamond', 'image', 'text'].includes(el.type)) return null;

            const b = getElementBounds(el);
            const cx = b.x + b.w / 2;
            const cy = b.y + b.h / 2;
            const angle = el.angle || 0;

            const rotX = (px, py) => cx + (px - cx) * Math.cos(angle) - (py - cy) * Math.sin(angle);
            const rotY = (px, py) => cy + (px - cx) * Math.sin(angle) + (py - cy) * Math.cos(angle);

            const handleSize = 10 / scale;
            const handles = {
                tl: { x: rotX(b.x, b.y), y: rotY(b.x, b.y) },
                tr: { x: rotX(b.x + b.w, b.y), y: rotY(b.x + b.w, b.y) },
                bl: { x: rotX(b.x, b.y + b.h), y: rotY(b.x, b.y + b.h) },
                br: { x: rotX(b.x + b.w, b.y + b.h), y: rotY(b.x + b.w, b.y + b.h) },
                rotate: { x: rotX(b.x + b.w / 2, b.y - 24), y: rotY(b.x + b.w / 2, b.y - 24) }
            };

            for (let key in handles) {
                if (Math.abs(x - handles[key].x) <= handleSize && Math.abs(y - handles[key].y) <= handleSize) {
                    return key;
                }
            }
            return null;
        }

        function moveElement(el, dx, dy) {
            if (el.type === 'rectangle' || el.type === 'image' || el.type === 'text') {
                el.x += dx; el.y += dy;
            } else if (['circle', 'diamond', 'line', 'arrow'].includes(el.type)) {
                el.startX += dx; el.startY += dy;
                el.endX += dx; el.endY += dy;
            } else if (el.type === 'pencil') {
                el.path.forEach(pt => { pt.x += dx; pt.y += dy; });
            }
        }

        function resizeElement(el, handle, currentX, currentY) {
            if (el.type === 'rectangle' || el.type === 'image' || el.type === 'text') {
                let x2 = el.x + el.w;
                let y2 = el.y + el.h;
                if (handle === 'tl') { el.x = currentX; el.y = currentY; el.w = x2 - currentX; el.h = y2 - currentY; }
                else if (handle === 'tr') { el.y = currentY; el.w = currentX - el.x; el.h = y2 - currentY; }
                else if (handle === 'bl') { el.x = currentX; el.w = x2 - currentX; el.h = currentY - el.y; }
                else if (handle === 'br') { el.w = currentX - el.x; el.h = currentY - el.y; }
            } else if (['circle', 'diamond'].includes(el.type)) {
                if (handle === 'tl') { el.startX = currentX; el.startY = currentY; }
                else if (handle === 'tr') { el.endX = currentX; el.startY = currentY; }
                else if (handle === 'bl') { el.startX = currentX; el.endY = currentY; }
                else if (handle === 'br') { el.endX = currentX; el.endY = currentY; }
            }
        }

        function getSnapPoint(x, y, excludeIndex) {
            const snapThreshold = 25 / scale;
            let closestDist = snapThreshold;
            let snapPt = { x, y };

            elements.forEach((el, idx) => {
                if (idx === excludeIndex) return;
                const layer = layers.find(l => l.id === el.layerId);
                if (!layer || !layer.visible) return;

                const anchors = getElementAnchors(el);
                anchors.forEach(pt => {
                    let d = Math.hypot(pt.x - x, pt.y - y);
                    if (d < closestDist) {
                        closestDist = d;
                        snapPt = { x: pt.x, y: pt.y };
                    }
                });
            });
            return snapPt;
        }

        function getElementAnchors(el) {
            let anchors = [];
            if (el.type === 'rectangle' || el.type === 'image' || el.type === 'text') {
                let x1 = el.x, y1 = el.y, x2 = el.x + el.w, y2 = el.y + el.h;
                anchors.push({x: x1 + (el.w/2), y: y1}, {x: x2, y: y1 + (el.h/2)}, {x: x1 + (el.w/2), y: y2}, {x: x1, y: y1 + (el.h/2)});
            } else if (el.type === 'circle' || el.type === 'diamond') {
                let rx = Math.abs(el.endX - el.startX) / 2;
                let ry = Math.abs(el.endY - el.startY) / 2;
                let cx = el.startX + (el.endX - el.startX) / 2;
                let cy = el.startY + (el.endY - el.startY) / 2;
                anchors.push({x: cx, y: cy - ry}, {x: cx + rx, y: cy}, {x: cx, y: cy + ry}, {x: cx - rx, y: cy});
            }
            return anchors;
        }

        function handleDoubleClick(e) {
            const world = getWorldCoords(e.clientX, e.clientY);
            const clickedIndex = findElementAt(world.x, world.y);
            if (clickedIndex !== null && elements[clickedIndex].type === 'text') {
                openTextInput(e.clientX, e.clientY, clickedIndex);
            }
        }

        function openTextInput(clientX, clientY, textElementIndex) {
            saveActiveText();
            const screenX = clientX;
            const screenY = clientY;

            textInput.style.left = screenX + 'px';
            textInput.style.top = screenY + 'px';
            textInput.style.color = strokeColor;

            if (textElementIndex !== null) {
                // Editing existing text: Semi-transparent white background
                editingTextIndex = textElementIndex;
                const el = elements[textElementIndex];
                textInput.value = el.text || '';
                textInput.style.width = Math.max(180, el.w * scale) + 'px';
                textInput.style.height = Math.max(50, el.h * scale) + 'px';
                textInput.style.background = 'rgba(255, 255, 255, 0.85)';
            } else {
                // Adding new text: Transparent background
                const worldPos = getWorldCoords(clientX, clientY);
                const newEl = {
                    type: 'text',
                    layerId: activeLayerId,
                    x: worldPos.x,
                    y: worldPos.y,
                    w: 220,
                    h: 60,
                    text: '',
                    color: strokeColor,
                    fontSize: 20,
                    isBold: false,
                    isItalic: false,
                    isUnderline: false,
                    angle: 0
                };
                elements.push(newEl);
                editingTextIndex = elements.length - 1;
                selectedElementIndex = editingTextIndex;
                textInput.value = '';
                textInput.style.width = '220px';
                textInput.style.height = '60px';
                textInput.style.background = 'transparent';
            }

            textInput.style.display = 'block';
            textInput.focus();
        }

        function drawDiamondPath(context, x1, y1, x2, y2) {
            let midX = x1 + (x2 - x1) / 2;
            let midY = y1 + (y2 - y1) / 2;
            context.beginPath();
            context.moveTo(midX, y1);
            context.lineTo(x2, midY);
            context.lineTo(midX, y2);
            context.lineTo(x1, midY);
            context.closePath();
        }

        function eraseAt(x, y) {
            const index = findElementAt(x, y);
            if (index !== null) {
                const el = elements[index];
                if (el.layerId === activeLayerId) {
                    elements.splice(index, 1);
                    if (selectedElementIndex === index) {
                        selectedElementIndex = null;
                        sideMenu.classList.remove('open');
                    }
                    saveToLocalStorage();
                    redraw();
                    showToast("Object successfully erased from current layer!");
                } else {
                    const ownerLayer = layers.find(l => l.id === el.layerId);
                    const layerName = ownerLayer ? ownerLayer.name : "another layer";
                    showToast(`Cannot erase: Object belongs to "${layerName}"! Switch layer to erase.`, true);
                }
            }
        }

        function findElementAt(x, y) {
            for (let i = elements.length - 1; i >= 0; i--) {
                const el = elements[i];
                const layer = layers.find(l => l.id === el.layerId);
                if (!layer || !layer.visible) continue;

                if (el.type === 'rectangle' || el.type === 'image' || el.type === 'text') {
                    if (x >= Math.min(el.x, el.x + el.w) && x <= Math.max(el.x, el.x + el.w) &&
                        y >= Math.min(el.y, el.y + el.h) && y <= Math.max(el.y, el.y + el.h)) return i;
                } else if (el.type === 'circle' || el.type === 'diamond') {
                    let rx = Math.abs(el.endX - el.startX) / 2;
                    let ry = Math.abs(el.endY - el.startY) / 2;
                    let cx = el.startX + (el.endX - el.startX) / 2;
                    let cy = el.startY + (el.endY - el.startY) / 2;
                    if (Math.pow(x - cx, 2) / Math.pow(rx || 1, 2) + Math.pow(y - cy, 2) / Math.pow(ry || 1, 2) <= 1.2) return i;
                } else if (el.type === 'line' || el.type === 'arrow') {
                    let d = distToSegment({x, y}, {x: el.startX, y: el.startY}, {x: el.endX, y: el.endY});
                    if (d < 8 / scale) return i;
                } else if (el.type === 'pencil') {
                    for (let pt of el.path) {
                        if (Math.hypot(pt.x - x, pt.y - y) < 10 / scale) return i;
                    }
                }
            }
            return null;
        }

        function distToSegment(p, p1, p2) {
            let l2 = Math.pow(p1.x - p2.x, 2) + Math.pow(p1.y - p2.y, 2);
            if (l2 === 0) return Math.hypot(p.x - p1.x, p.y - p1.y);
            let t = ((p.x - p1.x) * (p2.x - p1.x) + (p.y - p1.y) * (p2.y - p1.y)) / l2;
            t = Math.max(0, Math.min(1, t));
            return Math.hypot(p.x - (p1.x + t * (p2.x - p1.x)), p.y - (p1.y + t * (p2.y - p1.y)));
        }

        const loadedImages = {};

        function applyShapeFill(context, el, b) {
            if (!el.fillType || el.fillType === 'none') return false;
            if (el.fillType === 'solid' && el.fillColor) {
                context.fillStyle = el.fillColor;
                return true;
            }
            if (el.fillType === 'gradient' && el.fillColor) {
                const angle = ((el.gradientAngle || 0) * Math.PI) / 180;
                const cx = b.x + b.w / 2;
                const cy = b.y + b.h / 2;
                const r = Math.max(b.w, b.h);
                const x1 = cx - Math.cos(angle) * r / 2;
                const y1 = cy - Math.sin(angle) * r / 2;
                const x2 = cx + Math.cos(angle) * r / 2;
                const y2 = cy + Math.sin(angle) * r / 2;
                const grad = context.createLinearGradient(x1, y1, x2, y2);
                grad.addColorStop(0, el.fillColor);
                grad.addColorStop(1, el.fillColor2 || '#ffffff');
                context.fillStyle = grad;
                return true;
            }
            return false;
        }

        function renderWrappedText(context, el) {
            let fontStyle = el.isItalic ? 'italic ' : '';
            let fontWeight = el.isBold ? 'bold ' : '';
            context.font = `${fontStyle}${fontWeight}${el.fontSize}px 'Patrick Hand', cursive, sans-serif`;
            context.fillStyle = el.color || strokeColor;

            const paragraphs = (el.text || '').split(/\r?\n/);
            let lines = [];
            const lineHeight = el.fontSize * 1.3;

            paragraphs.forEach(para => {
                if (para === '') {
                    lines.push('');
                } else {
                    const words = para.split(' ');
                    let currentLine = '';
                    words.forEach((word, idx) => {
                        let testLine = currentLine + (idx === 0 ? '' : ' ') + word;
                        let metrics = context.measureText(testLine);
                        if (metrics.width > el.w && currentLine !== '') {
                            lines.push(currentLine);
                            currentLine = word;
                        } else {
                            currentLine = testLine;
                        }
                    });
                    lines.push(currentLine);
                }
            });

            lines.forEach((line, lIdx) => {
                let lineY = el.y + el.fontSize + (lIdx * lineHeight);
                context.fillText(line, el.x, lineY);

                if (el.isUnderline && line.trim() !== '') {
                    const m = context.measureText(line);
                    context.beginPath();
                    context.moveTo(el.x, lineY + 4);
                    context.lineTo(el.x + m.width, lineY + 4);
                    context.lineWidth = 1.5;
                    context.strokeStyle = el.color || strokeColor;
                    context.stroke();
                }
            });
        }

        function redraw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            ctx.translate(panX, panY);
            ctx.scale(scale, scale);

            layers.forEach(layer => {
                if (!layer.visible) return;

                elements.forEach((el, index) => {
                    if (el.layerId !== layer.id) return;
                    if (editingTextIndex === index && textInput.style.display === 'block') return; // hide while editing in textarea overlay

                    ctx.save();
                    
                    const b = getElementBounds(el);
                    const cx = b.x + b.w / 2;
                    const cy = b.y + b.h / 2;
                    ctx.translate(cx, cy);
                    ctx.rotate(el.angle || 0);
                    ctx.translate(-cx, -cy);

                    ctx.strokeStyle = el.color || strokeColor;
                    ctx.lineWidth = el.width || 4;
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';

                    if (el.type !== 'text' && el.isAnimated) {
                        ctx.setLineDash([12, 12]);
                        ctx.lineDashOffset = dashOffset;
                    } else {
                        ctx.setLineDash(getDashArray(el.lineType || 'solid', el.lineGap || 8));
                    }

                    if (el.type === 'pencil') {
                        ctx.beginPath();
                        ctx.moveTo(el.path[0].x, el.path[0].y);
                        for (let i = 1; i < el.path.length; i++) ctx.lineTo(el.path[i].x, el.path[i].y);
                        ctx.stroke();
                    } else if (el.type === 'rectangle') {
                        if (applyShapeFill(ctx, el, b)) ctx.fillRect(el.x, el.y, el.w, el.h);
                        ctx.strokeRect(el.x, el.y, el.w, el.h);
                    } else if (el.type === 'diamond') {
                        drawDiamondPath(ctx, el.startX, el.startY, el.endX, el.endY);
                        if (applyShapeFill(ctx, el, b)) ctx.fill();
                        ctx.stroke();
                    } else if (el.type === 'circle') {
                        let rx = Math.abs(el.endX - el.startX) / 2;
                        let ry = Math.abs(el.endY - el.startY) / 2;
                        let ocx = el.startX + (el.endX - el.startX) / 2;
                        let ocy = el.startY + (el.endY - el.startY) / 2;
                        ctx.beginPath();
                        ctx.ellipse(ocx, ocy, rx, ry, 0, 0, 2 * Math.PI);
                        if (applyShapeFill(ctx, el, b)) ctx.fill();
                        ctx.stroke();
                    } else if (el.type === 'line') {
                        renderLinePath(ctx, el.startX, el.startY, el.endX, el.endY, el.lineStyle || 'linear', el.lineType, el.lineGap);
                    } else if (el.type === 'arrow') {
                        renderArrow(ctx, el.startX, el.startY, el.endX, el.endY, el.lineStyle || 'linear', el.lineType, el.lineGap);
                    } else if (el.type === 'image') {
                        let img = loadedImages[el.imgSrc];
                        if (!img) {
                            img = new Image();
                            img.src = el.imgSrc;
                            loadedImages[el.imgSrc] = img;
                            img.onload = () => redraw();
                        }
                        if (img.complete) {
                            ctx.drawImage(img, el.x, el.y, el.w, el.h);
                        }
                        ctx.strokeRect(el.x, el.y, el.w, el.h);
                    } else if (el.type === 'text') {
                        renderWrappedText(ctx, el);
                    }

                    ctx.restore();

                    // Render Selection Box & Bounding Box
                    if (index === selectedElementIndex && currentTool === 'pointer') {
                        if (['rectangle', 'circle', 'diamond', 'image', 'text'].includes(el.type)) {
                            ctx.save();
                            ctx.translate(cx, cy);
                            ctx.rotate(el.angle || 0);
                            ctx.translate(-cx, -cy);

                            ctx.strokeStyle = getComputedStyle(document.body).getPropertyValue('--active-color').trim();
                            ctx.lineWidth = 1 / scale;
                            ctx.setLineDash([4 / scale, 4 / scale]);
                            ctx.strokeRect(b.x - 4, b.y - 4, b.w + 8, b.h + 8);
                            ctx.setLineDash([]);

                            ctx.beginPath();
                            ctx.moveTo(b.x + b.w / 2, b.y - 4);
                            ctx.lineTo(b.x + b.w / 2, b.y - 24);
                            ctx.lineWidth = 1.5 / scale;
                            ctx.stroke();

                            ctx.fillStyle = '#ffffff';
                            ctx.beginPath();
                            ctx.arc(b.x + b.w / 2, b.y - 24, 6 / scale, 0, 2 * Math.PI);
                            ctx.fill();
                            ctx.stroke();

                            ctx.lineWidth = 2 / scale;
                            const hSize = 8 / scale;
                            const handles = [
                                {x: b.x - 4, y: b.y - 4},
                                {x: b.x + b.w + 4, y: b.y - 4},
                                {x: b.x - 4, y: b.y + b.h + 4},
                                {x: b.x + b.w + 4, y: b.y + b.h + 4}
                            ];
                            handles.forEach(h => {
                                ctx.fillRect(h.x - hSize/2, h.y - hSize/2, hSize, hSize);
                                ctx.strokeRect(h.x - hSize/2, h.y - hSize/2, hSize, hSize);
                            });

                            ctx.restore();
                        } else if (el.type === 'line' || el.type === 'arrow') {
                            ctx.fillStyle = '#ffffff';
                            ctx.strokeStyle = '#0366d6';
                            ctx.lineWidth = 2 / scale;
                            const ptSize = 10 / scale;
                            [ {x: el.startX, y: el.startY}, {x: el.endX, y: el.endY} ].forEach(pt => {
                                ctx.fillRect(pt.x - ptSize/2, pt.y - ptSize/2, ptSize, ptSize);
                                ctx.strokeRect(pt.x - ptSize/2, pt.y - ptSize/2, ptSize, ptSize);
                            });
                        }
                    }
                });
            });

            // Draw active preview in real-time
            if (isDrawing) {
                ctx.save();
                ctx.strokeStyle = strokeColor;
                ctx.fillStyle = strokeColor;
                ctx.lineWidth = strokeWidth;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.setLineDash(getDashArray(lineType, lineGap));

                if (currentTool === 'pencil' && currentPath.length > 0) {
                    ctx.beginPath();
                    ctx.moveTo(currentPath[0].x, currentPath[0].y);
                    for (let i = 1; i < currentPath.length; i++) ctx.lineTo(currentPath[i].x, currentPath[i].y);
                    ctx.stroke();
                } else if (currentTool === 'rectangle') {
                    ctx.strokeRect(startX, startY, currentWorldX - startX, currentWorldY - startY);
                } else if (currentTool === 'diamond') {
                    drawDiamondPath(ctx, startX, startY, currentWorldX, currentWorldY);
                    ctx.stroke();
                } else if (currentTool === 'circle') {
                    let rx = Math.abs(currentWorldX - startX) / 2;
                    let ry = Math.abs(currentWorldY - startY) / 2;
                    let cx = startX + (currentWorldX - startX) / 2;
                    let cy = startY + (currentWorldY - startY) / 2;
                    ctx.beginPath();
                    ctx.ellipse(cx, cy, rx, ry, 0, 0, 2 * Math.PI);
                    ctx.stroke();
                } else if (currentTool === 'line') {
                    let snapped = getSnapPoint(currentWorldX, currentWorldY, null);
                    renderLinePath(ctx, startX, startY, snapped.x, snapped.y, lineStyle, lineType, lineGap);
                } else if (currentTool === 'arrow') {
                    let snapped = getSnapPoint(currentWorldX, currentWorldY, null);
                    renderArrow(ctx, startX, startY, snapped.x, snapped.y, lineStyle, lineType, lineGap);
                }
                ctx.restore();
            }

            ctx.restore();
        }

        function getOverallBoundingBox() {
            if (elements.length === 0) return { minX: 0, minY: 0, width: 800, height: 600 };
            let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
            elements.forEach(el => {
                const b = getElementBounds(el);
                minX = Math.min(minX, b.x);
                minY = Math.min(minY, b.y);
                maxX = Math.max(maxX, b.x + b.w);
                maxY = Math.max(maxY, b.y + b.h);
            });
            const pad = 40;
            return {
                minX: minX - pad,
                minY: minY - pad,
                width: (maxX - minX) + (pad * 2),
                height: (maxY - minY) + (pad * 2)
            };
        }

        function saveToLocalStorage() {
            localStorage.setItem('magic_draw_project', JSON.stringify({ elements, layers }));
        }

        function loadFromLocalStorage() {
            const saved = localStorage.getItem('magic_draw_project');
            if (saved) {
                try {
                    const data = JSON.parse(saved);
                    if (Array.isArray(data)) {
                        elements = data;
                    } else if (data && Array.isArray(data.elements)) {
                        elements = data.elements;
                        if (Array.isArray(data.layers) && data.layers.length > 0) {
                            layers = data.layers;
                            activeLayerId = layers[0].id;
                        }
                    }
                    renderLayerUI();
                    redraw();
                    if (elements.some(el => el.type !== 'text' && el.isAnimated)) {
                        updateAnimationLoop();
                    }
                } catch (e) {
                    console.error("Failed to load local storage", e);
                }
            }
        }

        // Clear All
        document.getElementById('clearBtn').addEventListener('click', () => {
            if (confirm("Clear canvas and start fresh?")) {
                elements = [];
                layers = [{ id: 'layer_default', name: 'Layer 1', visible: true }];
                activeLayerId = 'layer_default';
                selectedElementIndex = null;
                sideMenu.classList.remove('open');
                localStorage.removeItem('magic_draw_project');
                renderLayerUI();
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                dropdownMenu.classList.remove('open');
                showToast("Canvas cleared");
            }
        });

        // Export .draw File
        document.getElementById('exportBtn').addEventListener('click', () => {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({ elements, layers }, null, 2));
            const anchor = document.createElement('a');
            anchor.href = dataStr;
            anchor.download = "magic_draw_project.draw";
            document.body.appendChild(anchor);
            anchor.click();
            anchor.remove();
            dropdownMenu.classList.remove('open');
            showToast("Project exported successfully!");
        });

        // Export Cropped PNG
        document.getElementById('exportPngBtn').addEventListener('click', () => {
            if (elements.length === 0) {
                showToast("Nothing to export!", true);
                return;
            }
            const prevSelection = selectedElementIndex;
            selectedElementIndex = null;
            redraw();

            const bbox = getOverallBoundingBox();
            const exportCanvas = document.createElement('canvas');
            exportCanvas.width = bbox.width;
            exportCanvas.height = bbox.height;
            const eCtx = exportCanvas.getContext('2d');

            eCtx.fillStyle = '#ffffff';
            eCtx.fillRect(0, 0, exportCanvas.width, exportCanvas.height);

            eCtx.save();
            eCtx.translate(-bbox.minX, -bbox.minY);

            layers.forEach(layer => {
                if (!layer.visible) return;
                elements.forEach(el => {
                    if (el.layerId !== layer.id) return;
                    eCtx.save();
                    
                    const b = getElementBounds(el);
                    const cx = b.x + b.w / 2;
                    const cy = b.y + b.h / 2;
                    eCtx.translate(cx, cy);
                    eCtx.rotate(el.angle || 0);
                    eCtx.translate(-cx, -cy);

                    eCtx.strokeStyle = el.color;
                    eCtx.lineWidth = el.width;
                    eCtx.lineCap = 'round';
                    eCtx.lineJoin = 'round';

                    if (el.type !== 'text' && el.isAnimated) {
                        eCtx.setLineDash([12, 12]);
                        eCtx.lineDashOffset = dashOffset;
                    } else {
                        eCtx.setLineDash(getDashArray(el.lineType || 'solid', el.lineGap || 8));
                    }

                    if (el.type === 'rectangle') {
                        if (applyShapeFill(eCtx, el, b)) eCtx.fillRect(el.x, el.y, el.w, el.h);
                        eCtx.strokeRect(el.x, el.y, el.w, el.h);
                    } else if (el.type === 'diamond') {
                        drawDiamondPath(eCtx, el.startX, el.startY, el.endX, el.endY);
                        if (applyShapeFill(eCtx, el, b)) eCtx.fill();
                        eCtx.stroke();
                    } else if (el.type === 'circle') {
                        let rx = Math.abs(el.endX - el.startX) / 2;
                        let ry = Math.abs(el.endY - el.startY) / 2;
                        let ocx = el.startX + (el.endX - el.startX) / 2;
                        let ocy = el.startY + (el.endY - el.startY) / 2;
                        eCtx.beginPath();
                        eCtx.ellipse(ocx, ocy, rx, ry, 0, 0, 2 * Math.PI);
                        if (applyShapeFill(eCtx, el, b)) eCtx.fill();
                        eCtx.stroke();
                    } else if (el.type === 'line') {
                        renderLinePath(eCtx, el.startX, el.startY, el.endX, el.endY, el.lineStyle || 'linear', el.lineType, el.lineGap);
                    } else if (el.type === 'arrow') {
                        renderArrow(eCtx, el.startX, el.startY, el.endX, el.endY, el.lineStyle || 'linear', el.lineType, el.lineGap);
                    } else if (el.type === 'image') {
                        let img = loadedImages[el.imgSrc];
                        if (img && img.complete) {
                            eCtx.drawImage(img, el.x, el.y, el.w, el.h);
                        }
                    } else if (el.type === 'text') {
                        renderWrappedText(eCtx, el);
                    }

                    eCtx.restore();
                });
            });

            eCtx.restore();

            const dataUrl = exportCanvas.toDataURL('image/png');
            const anchor = document.createElement('a');
            anchor.href = dataUrl;
            anchor.download = "magic_draw_canvas.png";
            document.body.appendChild(anchor);
            anchor.click();
            anchor.remove();

            selectedElementIndex = prevSelection;
            redraw();
            dropdownMenu.classList.remove('open');
            showToast("Cropped PNG exported!");
        });

        // Export Animated SVG
        document.getElementById('exportSvgBtn').addEventListener('click', () => {
            if (elements.length === 0) {
                showToast("Nothing to export!", true);
                return;
            }
            const bbox = getOverallBoundingBox();
            let svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${bbox.minX} ${bbox.minY} ${bbox.width} ${bbox.height}" width="${bbox.width}" height="${bbox.height}">\n`;
            svg += `<style>
                @keyframes dash {
                    to { stroke-dashoffset: -40; }
                }
                .animated-dash {
                    animation: dash 1s linear infinite;
                }
                text { font-family: 'Patrick Hand', cursive, sans-serif; }
            </style>\n`;
            svg += `<rect x="${bbox.minX}" y="${bbox.minY}" width="${bbox.width}" height="${bbox.height}" fill="#ffffff"/>\n`;

            layers.forEach(layer => {
                if (!layer.visible) return;
                elements.forEach(el => {
                    if (el.layerId !== layer.id) return;
                    const stroke = el.color || '#1e1e1e';
                    const fill = el.fillType === 'solid' ? (el.fillColor || '#ffffff') : 'none';
                    const width = el.width || 4;
                    const dashClass = (el.type !== 'text' && el.isAnimated) ? ' class="animated-dash"' : '';
                    let dashArrayVal = '';
                    const lt = el.lineType || 'solid';
                    const lg = el.lineGap || 8;
                    if (lt === 'dash') dashArrayVal = `${lg},${lg}`;
                    else if (lt === 'dot') dashArrayVal = `2,${lg}`;
                    else if (lt === 'dash-dot') dashArrayVal = `${lg*1.5},${lg*0.5},2,${lg*0.5}`;
                    if (el.type !== 'text' && el.isAnimated) dashArrayVal = '12,12';
                    const dashAttr = dashArrayVal ? ` stroke-dasharray="${dashArrayVal}"` : '';
                    
                    const angle = el.angle || 0;
                    const b = getElementBounds(el);
                    const cx = b.x + b.w / 2;
                    const cy = b.y + b.h / 2;
                    const transform = angle ? ` transform="rotate(${angle * 180 / Math.PI} ${cx} ${cy})"` : '';

                    if (el.type === 'rectangle') {
                        svg += `<rect x="${el.x}" y="${el.y}" width="${el.w}" height="${el.h}" fill="${fill}" stroke="${stroke}" stroke-width="${width}" stroke-linecap="round" stroke-linejoin="round"${dashAttr}${dashClass}${transform}/>\n`;
                    } else if (el.type === 'circle') {
                        let rx = Math.abs(el.endX - el.startX) / 2;
                        let ry = Math.abs(el.endY - el.startY) / 2;
                        let ocx = el.startX + (el.endX - el.startX) / 2;
                        let ocy = el.startY + (el.endY - el.startY) / 2;
                        svg += `<ellipse cx="${ocx}" cy="${ocy}" rx="${rx}" ry="${ry}" fill="${fill}" stroke="${stroke}" stroke-width="${width}"${dashAttr}${dashClass}${transform}/>\n`;
                    } else if (el.type === 'diamond') {
                        let midX = el.startX + (el.endX - el.startX) / 2;
                        let midY = el.startY + (el.endY - el.startY) / 2;
                        let d = `M ${midX} ${el.startY} L ${el.endX} ${midY} L ${midX} ${el.endY} L ${el.startX} ${midY} Z`;
                        svg += `<path d="${d}" fill="${fill}" stroke="${stroke}" stroke-width="${width}" stroke-linecap="round" stroke-linejoin="round"${dashAttr}${dashClass}${transform}/>\n`;
                    } else if (el.type === 'line' || el.type === 'arrow') {
                        let d = '';
                        const style = el.lineStyle || 'linear';
                        const x1 = el.startX, y1 = el.startY, x2 = el.endX, y2 = el.endY;
                        if (style === 'elbow') {
                            let midX = (x1 + x2) / 2;
                            d = `M ${x1} ${y1} L ${midX} ${y1} L ${midX} ${y2} L ${x2} ${y2}`;
                        } else if (style === 'curved') {
                            let cx = (x1 + x2) / 2;
                            let cy = (y1 + y2) / 2 - 30;
                            d = `M ${x1} ${y1} Q ${cx} ${cy} ${x2} ${y2}`;
                        } else {
                            d = `M ${x1} ${y1} L ${x2} ${y2}`;
                        }
                        svg += `<path d="${d}" fill="none" stroke="${stroke}" stroke-width="${width}" stroke-linecap="round" stroke-linejoin="round"${dashAttr}${dashClass}${transform}/>\n`;

                        if (el.type === 'arrow') {
                            let angle = 0;
                            if (style === 'elbow') {
                                let midX = (x1 + x2) / 2;
                                angle = Math.atan2(0, x2 - midX);
                            } else if (style === 'curved') {
                                let cx = (x1 + x2) / 2;
                                let cy = (y1 + y2) / 2 - 30;
                                angle = Math.atan2(y2 - cy, x2 - cx);
                            } else {
                                angle = Math.atan2(y2 - y1, x2 - x1);
                            }
                            const headLen = 12;
                            const p1x = x2 - headLen * Math.cos(angle - Math.PI / 6);
                            const p1y = y2 - headLen * Math.sin(angle - Math.PI / 6);
                            const p2x = x2 - headLen * Math.cos(angle + Math.PI / 6);
                            const p2y = y2 - headLen * Math.sin(angle + Math.PI / 6);
                            svg += `<polygon points="${x2},${y2} ${p1x},${p1y} ${p2x},${p2y}" fill="${stroke}"${transform}/>\n`;
                        }
                    } else if (el.type === 'image') {
                        svg += `<image href="${el.imgSrc}" x="${el.x}" y="${el.y}" width="${el.w}" height="${el.h}"${transform}/>\n`;
                    } else if (el.type === 'text') {
                        svg += `<text x="${el.x}" y="${el.y + el.fontSize}" font-size="${el.fontSize}" fill="${stroke}"${transform}>${el.text || ''}</text>\n`;
                    } else if (el.type === 'pencil') {
                        let d = `M ${el.path[0].x} ${el.path[0].y}`;
                        for (let i = 1; i < el.path.length; i++) {
                            d += ` L ${el.path[i].x} ${el.path[i].y}`;
                        }
                        svg += `<path d="${d}" fill="none" stroke="${stroke}" stroke-width="${width}" stroke-linecap="round" stroke-linejoin="round"${dashAttr}${dashClass}${transform}/>\n`;
                    }
                });
            });

            svg += `</svg>`;

            const blob = new Blob([svg], { type: 'image/svg+xml;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const anchor = document.createElement('a');
            anchor.href = url;
            anchor.download = "magic_draw_animation.svg";
            document.body.appendChild(anchor);
            anchor.click();
            anchor.remove();
            dropdownMenu.classList.remove('open');
            showToast("Animated SVG exported successfully!");
        });

        // Import .draw File
        const fileInput = document.getElementById('import-file');
        document.getElementById('importBtn').addEventListener('click', () => {
            fileInput.click();
            dropdownMenu.classList.remove('open');
        });

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    const data = JSON.parse(evt.target.result);
                    if (Array.isArray(data)) {
                        elements = data;
                        layers = [{ id: 'layer_default', name: 'Layer 1', visible: true }];
                    } else if (data && Array.isArray(data.elements)) {
                        elements = data.elements;
                        if (Array.isArray(data.layers)) {
                            layers = data.layers;
                        }
                    }
                    activeLayerId = layers[0].id;
                    selectedElementIndex = null;
                    sideMenu.classList.remove('open');
                    saveToLocalStorage();
                    renderLayerUI();
                    redraw();
                    if (elements.some(el => el.type !== 'text' && el.isAnimated)) {
                        updateAnimationLoop();
                    }
                    showToast("Project imported successfully!");
                } catch (err) {
                    showToast("Could not parse .draw file.", true);
                }
            };
            reader.readAsText(file);
            fileInput.value = '';
        });

        loadFromLocalStorage();
    </script>
</body>
</html>
