<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MagicDraw</title>
    <!-- Import Excalidraw-like Handwriting Font -->
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f6f8fa;
            --canvas-bg: #ffffff;
            --grid-color: #e1e4e8;
            --toolbar-bg: #ffffff;
            --toolbar-border: #d1d5da;
            --text-color: #24292e;
            --btn-hover: #f1f3f5;
            --active-bg: #e7f5ff;
            --active-color: #0366d6;
            --border-color: #ced4da;
            --menu-shadow: rgba(0, 0, 0, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Patrick Hand', cursive, sans-serif;
            font-size: 16px;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: var(--bg-color);
            color: var(--text-color);
        }

        /* Top Header Bar */
        .header-bar {
            position: absolute;
            top: 16px;
            left: 16px;
            right: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 10;
            pointer-events: none;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
            pointer-events: auto;
        }

        .app-title {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 0.5px;
            color: var(--text-color);
            user-select: none;
        }

        /* Hamburger Menu */
        .menu-container {
            position: relative;
        }

        .hamburger-btn {
            background: var(--toolbar-bg);
            border: 1px solid var(--toolbar-border);
            color: var(--text-color);
            width: 40px;
            height: 40px;
            border-radius: 10px;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px var(--menu-shadow);
            transition: background 0.2s;
        }

        .hamburger-btn:hover {
            background: var(--btn-hover);
        }

        .dropdown-menu {
            position: absolute;
            top: 50px;
            left: 0;
            background: var(--toolbar-bg);
            border: 1px solid var(--toolbar-border);
            border-radius: 12px;
            box-shadow: 0 8px 24px var(--menu-shadow);
            width: 280px;
            padding: 12px;
            display: none;
            flex-direction: column;
            gap: 12px;
            z-index: 30;
            max-height: 80vh;
            overflow-y: auto;
        }

        .dropdown-menu.open {
            display: flex;
        }

        .menu-section {
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .menu-section:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .menu-section h4 {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #8b949e;
            margin-bottom: 2px;
        }

        .menu-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .menu-item-btn {
            background: var(--btn-hover);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            text-align: left;
            transition: background 0.2s;
        }

        .menu-item-btn:hover {
            background: var(--active-bg);
            color: var(--active-color);
            border-color: var(--active-color);
        }

        /* Layer List UI */
        .layer-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
            max-height: 140px;
            overflow-y: auto;
        }

        .layer-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 10px;
            border-radius: 6px;
            background: var(--btn-hover);
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .layer-item:hover {
            background: var(--active-bg);
        }

        .layer-item.active {
            background: var(--active-bg);
            color: var(--active-color);
            font-weight: bold;
            border: 1px solid var(--active-color);
        }

        .layer-controls {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        /* Top Toolbar (Center) */
        .toolbar {
            background: var(--toolbar-bg);
            border: 1px solid var(--toolbar-border);
            border-radius: 12px;
            box-shadow: 0 4px 16px var(--menu-shadow);
            display: flex;
            align-items: center;
            padding: 6px 8px;
            gap: 6px;
            pointer-events: auto;
        }

        .tool-group {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        button.tool-btn {
            background: transparent;
            border: 1px solid transparent;
            border-radius: 8px;
            width: 38px;
            height: 38px;
            cursor: pointer;
            color: var(--text-color);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        button.tool-btn:hover {
            background: var(--btn-hover);
        }

        button.tool-btn.active {
            background: var(--active-bg);
            color: var(--active-color);
            border-color: var(--active-color);
        }

        input[type="color"] {
            appearance: none;
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            background: none;
        }

        input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        input[type="color"]::-webkit-color-swatch { border: 1px solid var(--border-color); border-radius: 50%; }

        select, label, input[type="number"], input[type="range"] {
            color: var(--text-color);
            font-size: 15px;
        }

        select, input[type="number"] {
            padding: 4px 8px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: var(--toolbar-bg);
            cursor: pointer;
        }

        input[type="number"] {
            width: 70px;
        }

        /* Right Side Menu for Selected Object Properties */
        .side-menu {
            position: absolute;
            top: 80px;
            right: 20px;
            background: var(--toolbar-bg);
            border: 1px solid var(--toolbar-border);
            border-radius: 12px;
            box-shadow: 0 8px 24px var(--menu-shadow);
            width: 280px;
            padding: 14px;
            display: none;
            flex-direction: column;
            gap: 10px;
            z-index: 15;
            max-height: 80vh;
            overflow-y: auto;
        }

        .side-menu.open {
            display: flex;
        }

        .side-menu h3 {
            font-size: 16px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 6px;
            margin-bottom: 2px;
        }

        .side-menu-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 15px;
        }

        /* Toast Notification Popup */
        .toast-notification {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: #24292e;
            color: #ffffff;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 16px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.25);
            transition: transform 0.3s ease, opacity 0.3s ease;
            opacity: 0;
            z-index: 1000;
            pointer-events: none;
        }

        .toast-notification.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        /* Canvas Area with Dot Grid */
        canvas {
            display: block;
            background: var(--canvas-bg);
            background-image: radial-gradient(var(--grid-color) 1.5px, transparent 1.5px);
            background-size: 24px 24px;
            cursor: crosshair;
        }

        canvas.cursor-pointer { cursor: default; }
        canvas.cursor-grab { cursor: grab; }
        canvas.cursor-grabbing { cursor: grabbing; }
        canvas.cursor-nwse { cursor: nwse-resize; }
        canvas.cursor-nesw { cursor: nesw-resize; }
        canvas.cursor-crosshair { cursor: crosshair; }
        canvas.cursor-text { cursor: text; }
        canvas.cursor-eraser { cursor: cell; }
        canvas.cursor-rotate { cursor: grab; }

        /* Inline Text Input Overlay */
        #text-input {
            position: absolute;
            border: 2px dashed var(--active-color);
            outline: none;
            font-size: 20px;
            font-family: 'Patrick Hand', cursive, sans-serif;
            color: var(--text-color);
            padding: 8px;
            display: none;
            z-index: 20;
            resize: both;
            overflow: auto;
            white-space: pre-wrap;
            line-height: 1.4;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            border-radius: 8px;
        }

        #import-file { display: none; }
    </style>
</head>
<body>

    <!-- Header Bar -->
    <div class="header-bar">
        <div class="header-left">
            <!-- Hamburger Menu -->
            <div class="menu-container">
                <button class="hamburger-btn" id="hamburgerBtn" title="Menu">☰</button>
                <div class="dropdown-menu" id="dropdownMenu">
                    <div class="menu-section">
                        <h4>Project & View</h4>
                        <button class="menu-item-btn" id="resetViewBtn">Reset View (100% & Center)</button>
                        <button class="menu-item-btn" id="exportBtn">Export .draw</button>
                        <button class="menu-item-btn" id="exportPngBtn">Export Cropped PNG</button>
                        <button class="menu-item-btn" id="exportSvgBtn">Export Animated SVG</button>
                        <button class="menu-item-btn" id="importBtn">Import .draw</button>
                    </div>

                    <div class="menu-section">
                        <h4>Global Stroke & Line</h4>
                        <div class="menu-row">
                            <label>Color:</label>
                            <input type="color" id="strokeColor" value="#1e1e1e">
                        </div>
                        <div class="menu-row">
                            <label>Width:</label>
                            <select id="strokeWidth">
                                <option value="2">Thin</option>
                                <option value="4" selected>Normal</option>
                                <option value="8">Bold</option>
                            </select>
                        </div>
                        <div class="menu-row">
                            <label>Line Type:</label>
                            <select id="globalLineType">
                                <option value="solid">Solid</option>
                                <option value="dash">Dash</option>
                                <option value="dash-dot">Dash Dot</option>
                                <option value="dot">Dot</option>
                            </select>
                        </div>
                        <div class="menu-row">
                            <label>Gap Unit:</label>
                            <input type="number" id="globalLineGap" value="8" min="2" max="40">
                        </div>
                    </div>

                    <div class="menu-section" id="lineStyleSection" style="display: none;">
                        <h4>Line / Arrow Type</h4>
                        <select id="lineStyleSelect">
                            <option value="linear">Linear</option>
                            <option value="elbow">Elbow</option>
                            <option value="curved">Curved</option>
                        </select>
                    </div>

                    <!-- Layers Management Section -->
                    <div class="menu-section">
                        <div class="menu-row">
                            <h4>Layers</h4>
                            <button class="menu-item-btn" id="addLayerBtn" style="padding: 2px 8px; font-size: 13px;">+ Add Layer</button>
                        </div>
                        <div class="layer-list" id="layerListContainer"></div>
                    </div>

                    <div class="menu-section">
                        <h4>Actions</h4>
                        <button class="menu-item-btn" id="clearBtn" style="color: #e03131;">Clear All Canvas</button>
                    </div>
                </div>
            </div>

            <!-- App Title -->
            <span class="app-title">MagicDraw</span>
        </div>

        <!-- Center Drawing Tools Toolbar -->
        <div class="toolbar">
            <div class="tool-group">
                <button class="tool-btn active" data-tool="pointer" title="Pointer (Pan & Select)">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z"/></svg>
                </button>
                <button class="tool-btn" data-tool="pencil" title="Pencil">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>
                </button>
                <button class="tool-btn" data-tool="rectangle" title="Rectangle">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
                </button>
                <button class="tool-btn" data-tool="diamond" title="Diamond">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l10 10-10 10L2 12z"/></svg>
                </button>
                <button class="tool-btn" data-tool="circle" title="Circle">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/></svg>
                </button>
                <button class="tool-btn" data-tool="line" title="Line">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="19" x2="19" y2="5"/></svg>
                </button>
                <button class="tool-btn" data-tool="arrow" title="Arrow">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="19" x2="19" y2="5"/><polyline points="12 5 19 5 19 12"/></svg>
                </button>
                <button class="tool-btn" data-tool="text" title="Text (Click to add, Double-click to edit)">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 7 4 4 20 4 20 7"/><line x1="12" y1="4" x2="12" y2="20"/></svg>
                </button>
                <button class="tool-btn" data-tool="eraser" title="Eraser (Locks by active layer)">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 20H7L3 16c-1.2-1.2-1.2-3.1 0-4.3l9.5-9.5c1.2-1.2 3.1-1.2 4.3 0l4.7 4.7c1.2 1.2 1.2 3.1 0 4.3L12 20h8z"/><line x1="18" y1="13" x2="8" y2="3"/></svg>
                </button>
            </div>
        </div>
        
        <div style="width: 80px;"></div>
    </div>

    <!-- Right Side Menu for Selected Object Properties -->
    <div class="side-menu" id="sideMenu">
        <h3 id="sideMenuTitle">Properties</h3>
        
        <div class="side-menu-row" id="sideStrokeColorRow">
            <label>Color:</label>
            <input type="color" id="sideStrokeColor">
        </div>

        <div class="side-menu-row" id="sideFillTypeRow" style="display: none;">
            <label>Fill Style:</label>
            <select id="sideFillType">
                <option value="none">None</option>
                <option value="solid">Solid</option>
                <option value="gradient">Gradient</option>
            </select>
        </div>

        <div class="side-menu-row" id="sideFillColorRow" style="display: none;">
            <label>Color 1:</label>
            <input type="color" id="sideFillColor">
        </div>

        <div class="side-menu-row" id="sideFillColor2Row" style="display: none;">
            <label>Color 2:</label>
            <input type="color" id="sideFillColor2">
        </div>

        <div class="side-menu-row" id="sideGradientAngleRow" style="display: none;">
            <label>Grad Angle:</label>
            <input type="range" id="sideGradientAngle" min="0" max="360" value="0" style="width: 100px;">
        </div>

        <div class="side-menu-row" id="sideLineTypeRow">
            <label>Line Type:</label>
            <select id="sideLineType">
                <option value="solid">Solid</option>
                <option value="dash">Dash</option>
                <option value="dash-dot">Dash Dot</option>
                <option value="dot">Dot</option>
            </select>
        </div>

        <div class="side-menu-row" id="sideLineGapRow">
            <label>Gap Unit:</label>
            <input type="number" id="sideLineGap" value="8" min="2" max="40">
        </div>

        <!-- Text Specific Properties -->
        <div class="side-menu-row" id="sideTextSizeRow" style="display: none;">
            <label>Font Size:</label>
            <select id="sideTextSize">
                <option value="16">16px</option>
                <option value="20" selected>20px</option>
                <option value="28">28px</option>
                <option value="36">36px</option>
            </select>
        </div>

        <div class="side-menu-row" id="sideTextFormatRow" style="display: none;">
            <label>Style:</label>
            <div style="display: flex; gap: 4px;">
                <button class="menu-item-btn" id="sideBoldBtn" style="padding: 2px 8px; font-weight: bold;">B</button>
                <button class="menu-item-btn" id="sideItalicBtn" style="padding: 2px 8px; font-style: italic;">I</button>
                <button class="menu-item-btn" id="sideUnderlineBtn" style="padding: 2px 8px; text-decoration: underline;">U</button>
            </div>
        </div>

        <div class="side-menu-row" id="sideAnimateRow">
            <label>Animate:</label>
            <button class="menu-item-btn" id="sideAnimateBtn" style="padding: 4px 10px;">Toggle Dash Flow</button>
        </div>
    </div>

    <!-- Toast Notification Popup -->
    <div class="toast-notification" id="toastNotification">Action completed</div>

    <!-- Hidden Input for Dynamic Text Creation & In-Place Editing -->
    <textarea id="text-input" rows="2"></textarea>

    <!-- Canvas -->
    <canvas id="canvas"></canvas>

    <!-- Hidden File Input -->
    <input type="file" id="import-file" accept=".draw,.json">

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const textInput = document.getElementById('text-input');
        const toastNotification = document.getElementById('toastNotification');
        
        const hamburgerBtn = document.getElementById('hamburgerBtn');
        const dropdownMenu = document.getElementById('dropdownMenu');
        const sideMenu = document.getElementById('sideMenu');
        const sideMenuTitle = document.getElementById('sideMenuTitle');
        const sideStrokeColor = document.getElementById('sideStrokeColor');
        const sideFillType = document.getElementById('sideFillType');
        const sideFillTypeRow = document.getElementById('sideFillTypeRow');
        const sideFillColorRow = document.getElementById('sideFillColorRow');
        const sideFillColor = document.getElementById('sideFillColor');
        const sideFillColor2Row = document.getElementById('sideFillColor2Row');
        const sideFillColor2 = document.getElementById('sideFillColor2');
        const sideGradientAngleRow = document.getElementById('sideGradientAngleRow');
        const sideGradientAngle = document.getElementById('sideGradientAngle');

        const sideLineType = document.getElementById('sideLineType');
        const sideLineGap = document.getElementById('sideLineGap');
        
        const sideTextSizeRow = document.getElementById('sideTextSizeRow');
        const sideTextSize = document.getElementById('sideTextSize');
        const sideTextFormatRow = document.getElementById('sideTextFormatRow');
        const sideBoldBtn = document.getElementById('sideBoldBtn');
        const sideItalicBtn = document.getElementById('sideItalicBtn');
        const sideUnderlineBtn = document.getElementById('sideUnderlineBtn');
        const sideAnimateRow = document.getElementById('sideAnimateRow');
        const sideAnimateBtn = document.getElementById('sideAnimateBtn');

        const lineStyleSection = document.getElementById('lineStyleSection');
        const lineStyleSelect = document.getElementById('lineStyleSelect');
        const globalLineType = document.getElementById('globalLineType');
        const globalLineGap = document.getElementById('globalLineGap');
        const layerListContainer = document.getElementById('layerListContainer');
        const addLayerBtn = document.getElementById('addLayerBtn');
        const resetViewBtn = document.getElementById('resetViewBtn');

        function showToast(message, isError = false) {
            toastNotification.textContent = message;
            toastNotification.style.background = isError ? '#e03131' : '#24292e';
            toastNotification.classList.add('show');
            setTimeout(() => {
                toastNotification.classList.remove('show');
            }, 3000);
        }

        // Toggle Hamburger Menu
        hamburgerBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            dropdownMenu.classList.toggle('open');
        });

        window.addEventListener('click', (e) => {
            if (!dropdownMenu.contains(e.target) && e.target !== hamburgerBtn) {
                dropdownMenu.classList.remove('open');
            }
        });

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            redraw();
        }
        window.addEventListener('resize', resizeCanvas);
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // State Management
        let currentTool = 'pointer';
        let lineStyle = 'linear';
        let strokeColor = '#1e1e1e';
        let strokeWidth = 4;
        let lineType = 'solid';
        let lineGap = 8;
        let elements = [];
        let selectedElementIndex = null;
        let editingTextIndex = null;

        // Layers State
        let layers = [
            { id: 'layer_default', name: 'Layer 1', visible: true }
        ];
        let activeLayerId = 'layer_default';

        // Pan and Zoom State
        let panX = 0, panY = 0;
        let scale = 1.0;
        let isPanning = false;
        let panStartX = 0, panStartY = 0;

        let isDrawing = false;
        let isDragging = false;
        let isResizing = false;
        let isRotating = false;
        let isDraggingEndpoint = null; 
        let activeHandle = null; 
        
        let lastMouseX = 0;
        let lastMouseY = 0;
        let startX = 0;
        let startY = 0;
        let currentWorldX = 0;
        let currentWorldY = 0;
        let currentPath = [];

        // Smooth Animation Loop for Strokes/Lines
        let dashOffset = 0;
        let animationFrameId = null;

        function updateAnimationLoop() {
            const hasAnimated = elements.some(el => {
                const layer = layers.find(l => l.id === el.layerId);
                return el.type !== 'text' && el.isAnimated && layer && layer.visible;
            });
            if (hasAnimated) {
                dashOffset = (dashOffset - 0.8) % 40;
                redraw();
                animationFrameId = requestAnimationFrame(updateAnimationLoop);
            } else {
                animationFrameId = null;
            }
        }

        function getDashArray(type, gap) {
            if (type === 'dash') return [gap, gap];
            if (type === 'dot') return [2, gap];
            if (type === 'dash-dot') return [gap * 1.5, gap * 0.5, 2, gap * 0.5];
            return [];
        }

        resetViewBtn.addEventListener('click', () => {
            panX = 0;
            panY = 0;
            scale = 1.0;
            redraw();
            dropdownMenu.classList.remove('open');
            showToast("View reset to default position (100% & Center)");
        });

        // Mouse-assisted Zoom
        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            const zoomIntensity = 0.1;
            const mouseX = e.clientX;
            const mouseY = e.clientY;

            const worldX = (mouseX - panX) / scale;
            const worldY = (mouseY - panY) / scale;

            if (e.deltaY < 0) {
                scale *= (1 + zoomIntensity);
            } else {
                scale /= (1 + zoomIntensity);
            }
            scale = Math.max(0.1, Math.min(10, scale));

            panX = mouseX - worldX * scale;
            panY = mouseY - worldY * scale;

            redraw();
        }, { passive: false });

        // Render Layers List
        function renderLayerUI() {
            layerListContainer.innerHTML = '';
            [...layers].reverse().forEach(layer => {
                const item = document.createElement('div');
                item.className = `layer-item ${layer.id === activeLayerId ? 'active' : ''}`;
                
                item.addEventListener('click', () => {
                    activeLayerId = layer.id;
                    selectedElementIndex = null;
                    sideMenu.classList.remove('open');
                    renderLayerUI();
                    redraw();
